name: geo_attendance_system
description: Major Project

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  splashscreen: any
  # flutter_sparkline: any # Temporarily commented out for model testing
  flutter_staggered_grid_view: any
  # calendarro: ^1.0.0 # Temporarily commented out for model testing
  firebase_auth: any
  flutter_screenutil: ^5.9.3
  table_calendar: any
  firebase_database: any
  google_maps_flutter: ^0.5.21+8
  # device_id: ^0.2.0 # Temporarily commented out for model testing - discontinued
  location: ^4.4.0 # Updated to null-safe version
  flutter_spinkit: ^5.2.1
  # flutter_datetime_picker:
  #   git:
  #     url: https://github.com/derohimat/flutter_datetime_picker.git # Temporarily commented out for model testing
  # grouped_buttons: ^1.0.3 # Temporarily commented out for model testing
  permission_handler: ^6.0.0 # Updated to null-safe version
  device_info: ^2.0.3 # Updated to null-safe version
  firebase_messaging: ^10.0.0 # Updated to null-safe version
  flutter_local_notifications:


  geofencing:
    path: geofencing

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/gif/loading-gif.gif
    - assets/gif/tick.gif
    - assets/gif/close.gif
    - assets/gif/no_entry.gif
    - assets/logo/logo.png
    - assets/back.jpg
    - assets/logo/logo-white.png
    - assets/logo/profile.jpg
  
  fonts:

    - family: Poppins-Bold
      fonts:
        - asset: assets/fonts/Poppins-Bold.otf

    - family: Poppins-Medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.otf

    - family: Sansation-Bold
      fonts:
        - asset: assets/fonts/Sansation-Bold.ttf

    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Bold.ttf
        - asset: assets/fonts/Bitter-Regular.ttf


